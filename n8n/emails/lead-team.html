<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ליד חדש מהאתר</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@900&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; background: #eef0f2; }
  @media (max-width: 620px) {
    .card { padding: 24px 18px !important; }
    .name { font-size: 24px !important; }
    .act { display: block !important; width: 100% !important; padding: 0 0 10px !important; }
    .act a { display: block !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#eef0f2;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#eef0f2;">%PREHEADER%</div>

<table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef0f2;">
<tr><td align="center" style="padding:24px 12px;">

  <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">

    <!-- פס מותג -->
    <tr><td dir="rtl" style="background:#12161a;border-top:3px solid #13e3e6;padding:14px 20px;">
      <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="48" valign="middle" style="padding:0 0 0 12px;">
            <img src="https://res.cloudinary.com/dmrksuz8a/image/upload/e_trim/w_50,h_50,c_fit/w_72,h_72,c_pad,b_rgb:eceef0/r_max/f_png/v1781354090/Gemini_Generated_Image_5xbjy55xbjy55xbjd_azqtnh.png" width="36" height="36" alt="Fitness Guy" style="display:block;border:0;width:36px;height:36px;">
          </td>
          <td dir="rtl" valign="middle" style="font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-weight:700;font-size:16px;color:#eceef0;text-align:right;">ליד חדש מהאתר</td>
          <td dir="ltr" valign="middle" style="font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:13px;color:#9aa4ac;text-align:left;">%TIME%</td>
        </tr>
      </table>
    </td></tr>

    <!-- כרטיס עבודה -->
    <tr><td class="card" dir="rtl" style="background:#ffffff;padding:28px 28px 24px;text-align:right;">

      <p class="name" style="margin:0 0 10px;font-family:'Noto Sans Hebrew',Arial,sans-serif;font-weight:900;font-size:28px;line-height:1.2;color:#12161a;">%NAME%</p>
      <p style="margin:0 0 22px;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:15px;color:#4a5056;">
        <span dir="ltr" style="display:inline-block;background:#06232b;color:#13e3e6;font-weight:700;font-size:14px;padding:5px 12px;">%TRACK%</span>
        &nbsp;·&nbsp; מטרה: %GOAL%
      </p>

      <!-- פרטי קשר -->
      <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #dbdfe3;border-bottom:1px solid #dbdfe3;">
        <tr>
          <td style="padding:12px 0;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:14px;color:#6b737b;width:70px;">טלפון</td>
          <td dir="ltr" style="padding:12px 0;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:16px;color:#12161a;text-align:right;"><a href="tel:%PHONE%" style="color:#12161a;text-decoration:none;">%PHONE_DISPLAY%</a></td>
        </tr>
        <tr>
          <td style="padding:0 0 12px;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:14px;color:#6b737b;">אימייל</td>
          <td dir="ltr" style="padding:0 0 12px;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:16px;color:#12161a;text-align:right;"><a href="mailto:%EMAIL%" style="color:#12161a;text-decoration:none;">%EMAIL%</a></td>
        </tr>
      </table>

      <!-- פעולות -->
      <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:18px 0 22px;">
        <tr>
          <td class="act" width="50%" style="padding:0 0 0 6px;">
            <a href="tel:%PHONE%" style="display:block;background:#13e3e6;color:#06232b;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-weight:700;font-size:16px;text-decoration:none;padding:14px 10px;text-align:center;">להתקשר</a>
          </td>
          <td class="act" width="50%" style="padding:0 6px 0 0;">
            <a href="mailto:%EMAIL%?subject=%MAIL_SUBJECT%" style="display:block;background:#ffffff;border:2px solid #12161a;color:#12161a;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-weight:700;font-size:16px;text-decoration:none;padding:12px 10px;text-align:center;">לשלוח מייל</a>
          </td>
        </tr>
      </table>

      <!-- תקציר -->
      <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td dir="rtl" style="background:#f4f6f7;border-right:4px solid #0aa9ad;padding:16px 18px;text-align:right;">
          <p style="margin:0 0 4px;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-weight:700;font-size:14px;color:#4a5056;">מה העסיק אותו</p>
          <p style="margin:0 0 14px;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:15px;line-height:1.6;color:#12161a;">%SUMMARY%</p>
          <p style="margin:0 0 4px;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-weight:700;font-size:14px;color:#4a5056;">הנימוק שהלקוח קיבל</p>
          <p style="margin:0;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:15px;line-height:1.6;color:#12161a;">%WHY%</p>
        </td></tr>
      </table>

      <!-- פרטים נוספים -->
      <p style="margin:18px 0 0;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:13px;line-height:1.7;color:#6b737b;">
        %CHAT% &nbsp;·&nbsp; דיוור: %MARKETING%
      </p>

    </td></tr>

    <tr><td dir="rtl" align="center" style="padding:16px 12px 0;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:12px;color:#8a9199;text-align:center;">
      נשלח אוטומטית מטופס ההתאמה באתר. כרטיס הלקוח כבר נשמר במערכת.
    </td></tr>

  </table>

</td></tr>
</table>
</body>
</html>
